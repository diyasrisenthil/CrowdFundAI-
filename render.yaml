services:
  # Python FastAPI ML Backend & Unified Full-Stack Application
  - type: web
    name: crowdfundai-app
    env: python
    buildCommand: "pip install -r backend/requirements.txt && cd frontend && npm install && npm run build && cd .."
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12

  # Optional Standalone Frontend Static Site
  - type: web
    name: crowdfundai-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
